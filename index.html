<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neexa Kaiwa N4 Prototype (Ngebut)</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; max-width: 500px; margin: auto; background-color: #f0f4f8;}
        #chatbox { height: 350px; overflow-y: auto; background: white; padding: 15px; border-radius: 8px; border: 1px solid #cdd4dc; margin-bottom: 10px;}
        .pesan { margin-bottom: 15px; padding: 10px; border-radius: 8px; line-height: 1.4;}
        .user { background: #dcf8c6; text-align: right; margin-left: 20%;}
        .ai { background: #f1f0f0; margin-right: 20%;}
        button { width: 100%; padding: 15px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; touch-action: none;}
        button:disabled { background: #a5c8ed; cursor: not-allowed;}
        #status { text-align: center; font-size: 13px; color: #666; font-style: italic; margin-bottom: 10px;}
        .rapor { background: #fff3cd; padding: 15px; border-radius: 8px; border: 1px solid #ffeeba; margin-top: 15px; font-size: 14px;}
        .rapor h3 { margin-top: 0; color: #856404; text-align: center;}
        table { width: 100%; border-collapse: collapse; margin-top: 10px;}
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: left;}
        th { background: #e9ecef;}
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #333;">Simulasi Kaiwa N4 (Mode Kilat)</h2>
    
    <div id="chatbox"></div>
    <div id="status">Pencet tombol dan sapa AI untuk memulai...</div>

    <button id="btnMulai">🎤 Tahan & Bicara</button>
    <div id="raporArea"></div>

    <script>
        // API KEY diletakkan langsung di Frontend
        const API_KEY = "AQ.Ab8RN6KelCymFC4a7txFNiFlQoKig0htPIYs6gLWOxg5yAaW0g";
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY;
        
        let riwayatChat = [];
        let putaran = 0; 
        const BATAS_PUTARAN = 7;

        const chatbox = document.getElementById("chatbox");
        const status = document.getElementById("status");
        const btnMulai = document.getElementById("btnMulai");
        const raporArea = document.getElementById("raporArea");

        // PEMANASAN MESIN SUARA: Menarik data suara bahasa Jepang sejak awal web dimuat
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices(); 
        };

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const pengenalSuara = new SpeechRecognition();
        pengenalSuara.lang = 'ja-JP'; 
        pengenalSuara.interimResults = false;

        const mulaiRekam = (e) => {
            if (e.type === 'touchstart') e.preventDefault(); 
            pengenalSuara.start();
            btnMulai.innerText = "🔴 Mendengarkan... (Lepas untuk kirim)";
            btnMulai.style.background = "#dc3545";
        };

        const hentiRekam = (e) => {
            if (e.type === 'touchend') e.preventDefault();
            pengenalSuara.stop();
            btnMulai.innerText = "Memproses...";
            btnMulai.disabled = true;
        };

        btnMulai.addEventListener('mousedown', mulaiRekam);
        btnMulai.addEventListener('mouseup', hentiRekam);
        btnMulai.addEventListener('touchstart', mulaiRekam, {passive: false});
        btnMulai.addEventListener('touchend', hentiRekam, {passive: false});

        pengenalSuara.onresult = (event) => {
            const teksSiswa = event.results[0][0].transcript;
            tambahPesan("Siswa", teksSiswa, "user");
            putaran++; 
            kirimKeAILangsung(teksSiswa);
        };

        pengenalSuara.onerror = (event) => {
            status.innerText = "Suara tidak terdengar, coba lagi.";
            btnMulai.innerText = "🎤 Tahan & Bicara";
            btnMulai.style.background = "#007bff";
            btnMulai.disabled = false;
        };

        function tambahPesan(pengirim, teks, classNama) {
            chatbox.innerHTML += `<div class="pesan ${classNama}"><b>${pengirim}:</b><br>${teks}</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        async function kirimKeAILangsung(pesanSiswa) {
            status.innerText = "AI sedang berpikir kilat...";

            let jam = new Date().getHours();
            let salam = (jam >= 4 && jam < 11) ? "Ohayou gozaimasu" : (jam >= 11 && jam < 15) ? "Konnichiwa" : "Konbanwa";
            let instruksi = `Kamu teman Jepang ramah. Gunakan HANYA level JLPT N5-N4. Sekarang di Indonesia jam ${jam} (${salam}). ATURAN: 1. Jika ini awal chat, sapa pengguna dan tanya 1 hal ringan. 2. Gali topik 2 kali sebelum ganti. 3. Gunakan 'Chinamini'/'Tokoro de' jika ganti topik. 4. JIKA pengguna pamitan, letakkan teks '[SELESAI]'. 5. WAJIB balas sangat singkat, maksimal 1 atau 2 kalimat pendek agar percakapan mengalir cepat.`;

            let contents = riwayatChat.map(chat => ({ "role": chat.role, "parts": [{"text": chat.text}] }));
            contents.push({ "role": "user", "parts": [{"text": pesanSiswa}] });

            let payload = {
                "systemInstruction": { "parts": [{ "text": instruksi }] },
                "contents": contents,
                "generationConfig": { "temperature": 0.7, "maxOutputTokens": 60 } // Limitasi keluaran agar respons seketika
            };

            try {
                let response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                let data = await response.json();
                
                if(data.error) {
                    throw new Error(data.error.message);
                }

                let teksAI = data.candidates[0].content.parts[0].text;
                let obrolanSelesai = false;

                if (teksAI.includes("[SELESAI]") || putaran >= BATAS_PUTARAN) {
                    teksAI = teksAI.replace("[SELESAI]", "").trim();
                    obrolanSelesai = true;
                }

                tambahPesan("AI Jepang", teksAI, "ai");
                riwayatChat.push({"role": "user", "text": pesanSiswa});
                riwayatChat.push({"role": "model", "text": teksAI});
                
                bacaTeks(teksAI);

                if (obrolanSelesai) {
                    status.innerText = "Sesi selesai. Sedang membuat rapor...";
                    btnMulai.style.display = "none"; 
                    mintaRaporLangsung();
                } else {
                    status.innerText = `Putaran ${putaran} dari ${BATAS_PUTARAN}`;
                    btnMulai.innerText = "🎤 Tahan & Bicara";
                    btnMulai.style.background = "#007bff";
                    btnMulai.disabled = false;
                }
            } catch (err) {
                status.innerText = "Error API: " + err.message;
                alert("Mesin Error: \n" + err.message);
                btnMulai.innerText = "🎤 Tahan & Bicara";
                btnMulai.style.background = "#dc3545";
                btnMulai.disabled = false;
            }
        }

        async function mintaRaporLangsung() {
            let instruksiRapor = "Kamu adalah guru penilai. Analisis riwayat percakapan. Keluarkan HANYA output JSON murni tanpa markdown, dengan format persis: " +
                '{"skor": 85, "tata_bahasa": "komentar", "kosakata": "komentar", "kelancaran": "komentar", "koreksi": [{"kamu_ucap": "...", "seharusnya": "...", "catatan": "..."}], "kesimpulan": "pesan fokus latihan"}';

            let contents = riwayatChat.map(chat => ({ "role": chat.role, "parts": [{"text": chat.text}] }));

            let payload = {
                "systemInstruction": { "parts": [{ "text": instruksiRapor }] },
                "contents": contents,
                "generationConfig": { "temperature": 0.2 }
            };

            try {
                let response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let data = await response.json();
                let balasanAI = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                
                let rapor = JSON.parse(balasanAI);
                
                let tabelHTML = `<table><tr><th>Ucapmu</th><th>Seharusnya</th><th>Catatan</th></tr>`;
                rapor.koreksi.forEach(k => {
                    tabelHTML += `<tr><td>${k.kamu_ucap}</td><td>${k.seharusnya}</td><td>${k.catatan}</td></tr>`;
                });
                tabelHTML += `</table>`;

                raporArea.innerHTML = `
                    <div class="rapor">
                        <h3>Skor Akhir: ${rapor.skor}/100</h3>
                        <p><b>Tata Bahasa:</b> ${rapor.tata_bahasa}</p>
                        <p><b>Kosakata:</b> ${rapor.kosakata}</p>
                        <p><b>Kelancaran:</b> ${rapor.kelancaran}</p>
                        ${tabelHTML}
                        <p style="margin-top:15px; color:#c82333;"><b>Instruksi AI:</b> ${rapor.kesimpulan}</p>
                    </div>
                `;
                status.innerText = "Evaluasi selesai!";
            } catch (err) {
                status.innerText = "Gagal membuat rapor. Coba lagi.";
            }
        }

        function bacaTeks(teks) {
            const robot = new SpeechSynthesisUtterance(teks);
            robot.lang = 'ja-JP';
            window.speechSynthesis.speak(robot);
        }
    </script>
</body>
</html>
